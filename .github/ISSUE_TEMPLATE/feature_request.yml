name: Feature request
description: A G HUB feature you miss, or an idea
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes: {label: What would you like SuperStrike Studio to do?, description: "If G HUB has it, say where."}
    validations: {required: true}
  - type: textarea
    id: why
    attributes: {label: Why does it matter for you?, description: "The game or the way you play helps us choose."}
