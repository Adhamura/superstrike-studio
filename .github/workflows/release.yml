name: Release

# Publishes the GitHub Release v<version> automatically:
#   SuperStrike-Studio-<version>-windows-x64.zip   portable Windows build (no installer)
#   SHA256SUMS
# Linux users build from source with ./install.sh (see the README).
# Every push to main whose version (project(... VERSION x.y.z) in CMakeLists.txt) has no tag yet
# is tested, built and published (it creates the tag). To release: raise the version, add a
# "## <version>" section to CHANGELOG.md, merge. Pushing a tag v<version> or "Run workflow" also work.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Is this version new?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      new: ${{ steps.ver.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        shell: bash
        run: |
          set -euo pipefail
          v=$(sed -n 's/^project(superstrike_studio VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::no project(... VERSION x.y.z) in CMakeLists.txt"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::Tag $GITHUB_REF_NAME != version $v"; exit 1; }
            echo "new=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/v$v" > /dev/null 2>&1; then
            echo "Tag v$v exists already: nothing to release."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build and test
    needs: check
    if: needs.check.outputs.new == 'true'
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish
    needs: [check, build]
    if: needs.check.outputs.new == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          set -euo pipefail
          awk -v v="$VERSION" '
            $0 == "## " v { on = 1; next }
            /^## / { on = 0 }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section '## $VERSION'"; exit 1
          fi
          cat >> "$RUNNER_TEMP/notes.md" <<NOTES

          ### Install

          **Windows 10 / 11 (64-bit):** download **SuperStrike-Studio-$VERSION-windows-x64.zip**, unzip it
          anywhere and run \`superstrike-studio.exe\`. No installer, no service, no account. Close Logitech
          G HUB first (also in the tray). SmartScreen may say "Windows protected your PC" because the exe is
          not signed with a paid certificate: click **More info → Run anyway**.

          **Linux:** build from source (one command, about a minute):
          \`\`\`bash
          git clone https://github.com/Adhamura/SuperStrike-Studio && cd SuperStrike-Studio
          ./install.sh               # app menu entry + desktop launcher
          sudo ./install.sh --udev   # once, if the app says it has no permission for /dev/hidraw*
          \`\`\`
          Needs GTK 4, libadwaita 1.7+, librsvg, json-glib, glib-networking, cmake, gettext and a C++20 compiler.

          **No mouse yet?** Start it with \`--demo\` to try every page with a simulated PRO X3 SUPERSTRIKE.

          Check downloads with \`sha256sum -c SHA256SUMS --ignore-missing\`.
          NOTES
          cat "$RUNNER_TEMP/notes.md"

      - uses: actions/download-artifact@v4
        with:
          name: SuperStrike-Studio-windows-x64
          path: SuperStrike-Studio

      - name: Pack the files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          zip -qr9 "dist/SuperStrike-Studio-$VERSION-windows-x64.zip" SuperStrike-Studio
          (cd dist && sha256sum "SuperStrike-Studio-$VERSION-windows-x64.zip" > SHA256SUMS)
          ls -la dist

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: SuperStrike Studio ${{ needs.check.outputs.version }}
          body_path: ${{ runner.temp }}/notes.md
          files: |
            dist/SuperStrike-Studio-${{ needs.check.outputs.version }}-windows-x64.zip
            dist/SHA256SUMS
