name: Release

# Publishes the GitHub Release v<version> automatically:
#   SuperStrike-Studio-<version>-windows-x64.exe   Windows, one file (no installer, no zip)
#   SuperStrike-Studio-<version>-x86_64.AppImage   Linux, one file (any x86_64 distro)
#   SuperStrike-Studio-<version>-macos-arm64.dmg    macOS, Apple silicon (the app in a disk image)
#   SuperStrike-Studio-<version>-macos-x86_64.dmg   macOS, Intel
#   SHA256SUMS
# Every push to main whose version (project(... VERSION x.y.z) in CMakeLists.txt) has no tag yet
# is tested, built and published (it creates the tag). To release: raise the version, add a
# "## <version>" section to CHANGELOG.md, merge. Pushing a tag v<version> or "Run workflow" also work.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Is this version new?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      new: ${{ steps.ver.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        shell: bash
        run: |
          set -euo pipefail
          v=$(sed -n 's/^project(superstrike_studio VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::no project(... VERSION x.y.z) in CMakeLists.txt"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::Tag $GITHUB_REF_NAME != version $v"; exit 1; }
            echo "new=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/v$v" > /dev/null 2>&1; then
            echo "Tag v$v exists already: nothing to release."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build and test
    needs: check
    if: needs.check.outputs.new == 'true'
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish
    needs: [check, build]
    if: needs.check.outputs.new == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          set -euo pipefail
          awk -v v="$VERSION" '
            $0 == "## " v { on = 1; next }
            /^## / { on = 0 }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section '## $VERSION'"; exit 1
          fi
          # install steps for this version (shared with repack.yml)
          { echo; sed "s/@VERSION@/$VERSION/g" tools/release-install.md; } >> "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - uses: actions/download-artifact@v4
        with:
          name: SuperStrike-Studio-windows-x64
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: SuperStrike-Studio-linux-x86_64
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          pattern: SuperStrike-Studio-macos-*
          merge-multiple: true
          path: artifacts

      - name: Name the files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mv artifacts/SuperStrike-Studio-windows-x64.exe "dist/SuperStrike-Studio-$VERSION-windows-x64.exe"
          mv artifacts/SuperStrike-Studio-x86_64.AppImage "dist/SuperStrike-Studio-$VERSION-x86_64.AppImage"
          chmod +x "dist/SuperStrike-Studio-$VERSION-x86_64.AppImage"
          for arch in arm64 x86_64; do
            mv "artifacts/SuperStrike-Studio-macos-$arch.dmg" "dist/SuperStrike-Studio-$VERSION-macos-$arch.dmg"
          done
          (cd dist && sha256sum SuperStrike-Studio-* > SHA256SUMS)
          ls -la dist

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: SuperStrike Studio ${{ needs.check.outputs.version }}
          body_path: ${{ runner.temp }}/notes.md
          files: |
            dist/SuperStrike-Studio-${{ needs.check.outputs.version }}-windows-x64.exe
            dist/SuperStrike-Studio-${{ needs.check.outputs.version }}-x86_64.AppImage
            dist/SuperStrike-Studio-${{ needs.check.outputs.version }}-macos-arm64.dmg
            dist/SuperStrike-Studio-${{ needs.check.outputs.version }}-macos-x86_64.dmg
            dist/SHA256SUMS
