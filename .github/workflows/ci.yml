name: CI

# Builds SuperStrike Studio on Linux (Arch: GTK 4 and libadwaita new enough), on Windows (MSYS2
# UCRT64, the same script users run) and on macOS (Homebrew; Apple silicon and Intel), then starts
# the real app with the demo mouse (--demo, src/hid_sim.cpp) and renders every page to a PNG. It
# also makes the one-file releases and starts them the same way: the Linux AppImage, the Windows
# exe (built with build-windows.bat) and the macOS app (from its disk image). The PNGs and the
# release files are kept as artifacts. Also used by release.yml.
on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (Arch) build and smoke test
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install packages
        run: |
          pacman -Syu --noconfirm --needed base-devel cmake gettext gtk4 libadwaita librsvg json-glib \
            xorg-server-xvfb xorg-xauth inter-font git glib-networking ca-certificates \
            patchelf binutils wget
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build/release -DCMAKE_BUILD_TYPE=MinSizeRel
          cmake --build build/release -j"$(nproc)"
          ls -la build/release/superstrike-studio
          build/release/superstrike-studio --version
      - name: Translations are complete
        shell: bash
        run: |
          bad=0
          for po in po/*.po; do
            out=$(msgfmt --check --statistics -o /dev/null "$po" 2>&1)
            echo "$po: $out"
            case "$out" in *untranslated*|*fuzzy*) bad=1 ;; esac
          done
          exit $bad
      - name: Smoke test with the demo mouse
        shell: bash
        run: |
          mkdir -p shots
          for page in hits buttons sensor profiles device; do
            SS_SHOT_CLEAN=1 GSK_RENDERER=cairo timeout 60 xvfb-run -a -s "-screen 0 1600x1000x24" \
              build/release/superstrike-studio --demo --shot "$page:$PWD/shots/linux-$page.png"
            test -s "shots/linux-$page.png" || { echo "::error::no screenshot of $page"; exit 1; }
          done
          ls -la shots
      - name: Update check reaches GitHub (HTTPS)
        shell: bash
        run: |
          # 0 = got the latest release; 2 = GitHub answered with an error (rate limit, no release yet);
          # 1 = no connection or TLS failure, which is a bug in the app
          rc=0; build/release/superstrike-studio --check-updates || rc=$?
          [ "$rc" != 1 ] || { echo "::error::update check could not reach api.github.com"; exit 1; }
      - name: Build the AppImage
        run: tools/linux/build-appimage.sh
      - name: Smoke test the AppImage
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1   # no FUSE in the container
        run: |
          app=dist/SuperStrike-Studio-x86_64.AppImage
          "$app" --version
          SS_SHOT_CLEAN=1 GSK_RENDERER=cairo timeout 60 xvfb-run -a -s "-screen 0 1600x1000x24" \
            "$app" --demo --shot "hits:$PWD/shots/appimage-hits.png"
          test -s shots/appimage-hits.png || { echo "::error::the AppImage made no screenshot"; exit 1; }
          rc=0; "$app" --check-updates || rc=$?
          [ "$rc" != 1 ] || { echo "::error::the AppImage could not reach api.github.com"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-linux
          path: shots/
      - uses: actions/upload-artifact@v4
        with:
          name: SuperStrike-Studio-linux-x86_64
          path: dist/SuperStrike-Studio-x86_64.AppImage

  windows:
    name: Windows build and smoke test
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-gtk4 mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-librsvg mingw-w64-ucrt-x86_64-json-glib
            mingw-w64-ucrt-x86_64-gettext-runtime mingw-w64-ucrt-x86_64-gettext-tools
            mingw-w64-ucrt-x86_64-ntldd zip
      - name: Build with build-windows.bat (folder and one-file exe)
        shell: cmd
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: build-windows.bat --no-pause
      - name: Smoke test with the demo mouse (one-file exe)
        run: |
          mkdir -p shots
          exe=dist/SuperStrike-Studio-windows-x64.exe
          for page in hits buttons sensor profiles device; do
            out="$(cygpath -w "$PWD/shots/windows-$page.png")"
            SS_SHOT_CLEAN=1 GSK_RENDERER=cairo timeout 90 "$exe" --demo --shot "$page:$out" || true
            test -s "shots/windows-$page.png" || { echo "::error::no screenshot of $page on Windows"; exit 1; }
          done
          ls -la shots
      - name: Update check reaches GitHub (WinHTTP)
        run: |
          rc=0; timeout 60 dist/SuperStrike-Studio-windows-x64.exe --check-updates > update.txt 2>&1 || rc=$?
          cat update.txt; echo "exit code $rc"
          [ "$rc" != 1 ] && [ "$rc" != 124 ] || { echo "::error::update check could not reach api.github.com"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-windows
          path: shots/
      - uses: actions/upload-artifact@v4
        with:
          name: SuperStrike-Studio-windows-x64
          path: dist/SuperStrike-Studio-windows-x64.exe

  macos:
    name: macOS (${{ matrix.arch }}) build and smoke test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest       # Apple silicon
            arch: arm64
          - runner: macos-15-intel     # Intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install packages (Homebrew)
        run: brew install cmake pkgconf gettext gtk4 libadwaita librsvg json-glib adwaita-icon-theme dylibbundler
      - name: Build the app and the disk image
        run: tools/macos/build-macos.sh
      - name: Smoke test the app from the disk image
        shell: bash
        run: |
          set -euo pipefail
          hdiutil attach "dist/SuperStrike-Studio-macos-${{ matrix.arch }}.dmg" -mountpoint /tmp/ss -nobrowse
          exe="/tmp/ss/SuperStrike Studio.app/Contents/MacOS/superstrike-studio"
          run() { perl -e 'alarm shift; exec @ARGV' "$@"; }   # macOS has no timeout(1)
          "$exe" --version
          echo "minimum macOS: $(plutil -extract LSMinimumSystemVersion raw "/tmp/ss/SuperStrike Studio.app/Contents/Info.plist")"
          mkdir -p shots
          for page in hits buttons sensor profiles device; do
            SS_SHOT_CLEAN=1 GSK_RENDERER=cairo run 90 "$exe" --demo --shot "$page:$PWD/shots/macos-$page.png" || true
            test -s "shots/macos-$page.png" || { echo "::error::no screenshot of $page on macOS"; exit 1; }
          done
          ls -la shots
          # 0 = latest release, 2 = GitHub answered with an error, 1 = no connection or TLS failure (a bug)
          rc=0; run 60 "$exe" --check-updates || rc=$?
          [ "$rc" = 0 ] || [ "$rc" = 2 ] || { echo "::error::update check could not reach api.github.com"; exit 1; }
          hdiutil detach /tmp/ss
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-macos-${{ matrix.arch }}
          path: shots/
      - uses: actions/upload-artifact@v4
        with:
          name: SuperStrike-Studio-macos-${{ matrix.arch }}
          path: dist/SuperStrike-Studio-macos-${{ matrix.arch }}.dmg
